name: Backend

# Scoped to backend/** so a mobile-only change doesn't spin up Postgres and build an
# image, and so commits that touch neither half (like the initial scaffolding) don't
# run a job that has nothing to build.
#
# This file is deliberately absent from the paths filter: including it means any commit
# editing the workflow runs it, which fails on a tree where backend/ doesn't exist yet.
# The tradeoff is that a workflow-only edit isn't exercised until the next backend change.
on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nokori
          POSTGRES_PASSWORD: nokori
          POSTGRES_DB: nokori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: backend
        env:
          NOKORI_TEST_DB_URL: jdbc:postgresql://localhost:5432/nokori_test
          NOKORI_TEST_DB_USER: nokori
          NOKORI_TEST_DB_PASSWORD: nokori
        run: mvn -B verify

      - name: Build image
        working-directory: backend
        run: docker build -t nokori-api:${{ github.sha }} .
