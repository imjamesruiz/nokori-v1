spring:
  application:
    name: nokori-api
  datasource:
    url: ${NOKORI_DB_URL:jdbc:postgresql://localhost:5432/nokori_dev}
    username: ${NOKORI_DB_USER:${USER:postgres}}
    password: ${NOKORI_DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nokori:
  jwt:
    # Dev-only fallback. Production must set NOKORI_JWT_SECRET (>= 32 bytes) from a secrets manager.
    secret: ${NOKORI_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: ${NOKORI_JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${NOKORI_JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${NOKORI_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}

logging:
  level:
    app.nokori: DEBUG
